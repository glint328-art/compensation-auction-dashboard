let favs=new Set(),mode='all';const $=s=>document.querySelector(s),money=n=>n==null?'-':new Intl.NumberFormat('ko-KR').format(n)+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),projectOf=id=>PROJECTS.find(p=>p.id===id)||{};function filtered(){let xs=[...AUCTION],q=$('#q').value.trim().toLowerCase(),r=$('#region').value,c=$('#confirm').value,st=$('#status').value,f=Number($('#fails').value||0);xs=xs.filter(x=>{let p=projectOf(x.projectId),blob=[x.caseNo,x.address,p.name,x.note].join(' ').toLowerCase();return(!q||blob.includes(q))&&(!r||x.region===r)&&(!c||x.confirm===c)&&(!st||x.status===st)&&(!f||x.failedCount>=f)});if(mode==='live')xs=xs.filter(x=>x.status==='진행');if(mode==='confirmed')xs=xs.filter(x=>x.confirm!=='미확인');if(mode==='fav')xs=xs.filter(x=>favs.has(x.id));let s=$('#sort').value;xs.sort((a,b)=>s==='failed'?b.failedCount-a.failedCount:s==='min'?(a.minimum??1e99)-(b.minimum??1e99):a.bidDate.localeCompare(b.bidDate));return xs}function render(){let body=$('#body');body.innerHTML='';filtered().forEach(x=>{let p=projectOf(x.projectId),tr=document.createElement('tr');tr.innerHTML=`<td><button class="star">${favs.has(x.id)?'★':'☆'}</button></td><td>${x.region}</td><td><b>${x.caseNo}</b></td><td>${x.address}</td><td><span class="pill ${x.status==='진행'?'live':'done'}">${x.status}</span></td><td>${money(x.appraisal)}</td><td>${money(x.minimum)}</td><td>${x.failedCount}회</td><td>${x.bidDate}</td><td><span class="pill ${x.confirm==='미확인'?'wait':'ok'}">${x.confirm}</span></td><td>${p.name||'-'}</td>`;tr.querySelector('.star').onclick=e=>{e.stopPropagation();favs.has(x.id)?favs.delete(x.id):favs.add(x.id);render()};tr.onclick=()=>showDetail(x);body.appendChild(tr)});$('#mAll').textContent=AUCTION.length;$('#mLive').textContent=AUCTION.filter(x=>x.status==='진행').length;$('#mConfirm').textContent=AUCTION.filter(x=>x.confirm!=='미확인').length;$('#mFail').textContent=AUCTION.filter(x=>x.failedCount>=2).length
