<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보상경매 투자 대시보드</title><style>:root{--bg:#f4f6f8;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--navy:#17365d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1540px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:flex-end}.muted{color:var(--muted);font-size:13px}.stamp{font-size:12px;background:#e8eef8;color:var(--navy);font-weight:700;padding:7px 10px;border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.metric{padding:14px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:25px;margin-top:4px}.filters{display:grid;grid-template-columns:2fr repeat(5,1fr) auto;gap:8px;margin:12px 0}input,select,button{height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 10px}.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tab.on{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px}.panel{overflow:hidden}.panel h2{font-size:15px;margin:0;padding:14px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1370px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}th{background:#f8fafc}.pill{padding:4px 7px;border-radius:999px;font-weight:700;font-size:10px}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.live{background:#dbeafe;color:#1d4ed8}.done{background:#f3f4f6;color:#4b5563}.urgent{background:#fee2e2;color:#991b1b}.soon{background:#ffedd5;color:#9a3412}.star{font-size:18px;border:0;background:transparent;height:auto}.detail{padding:14px}.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 9px;margin:14px 0;font-size:13px}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.link{display:inline-flex;padding:10px;background:#eff6ff;color:#1d4ed8;text-decoration:none;border-radius:8px;margin-top:8px}.error{padding:14px;color:#b91c1c}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}@media(max-width:1050px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><div><h1>보상경매 투자 대시보드</h1><div class="muted">전국 경매 DB × 보상사업 DB 지번 대조 · 오늘 이후 입찰 우선</div></div><div class="stamp" id="stamp">불러오는 중</div></div><div class="notice">메인 화면은 <b>오늘 이후 입찰 가능한 물건</b>만 먼저 보여줍니다. 지난 입찰·매각완료는 ‘전체/지난물건’ 탭에서 확인하세요.</div><div class="metrics"><div class="metric"><span>입찰예정</span><b id="mUpcoming">-</b></div><div class="metric"><span>D-7 이내</span><b id="mUrgent">-</b></div><div class="metric"><span>편입 확인/부분확인</span><b id="mConfirm">-</b></div><div class="metric"><span>2회 이상 유찰</span><b id="mFail">-</b></div><div class="metric"><span>전체 DB</span><b id="mAll">-</b></div></div><div class="filters"><input id="q" placeholder="사건번호·지번·사업명 검색"><select id="region"><option value="">전국</option><option>수도권</option><option>충청권</option><option>호남권</option><option>영남권</option><option>강원권</option><option>제주권</option></select><select id="confirm"><option value="">편입상태 전체</option><option>확인</option><option>부분확인</option><option>미확인</option></select><select id="fails"><option value="">유찰횟수 전체</option><option value="1">1회 이상</option><option value="2">2회 이상</option><option value="3">3회 이상</option><option value="4">4회 이상</option></select><select id="status"><option value="">상태 전체</option><option>진행</option><option>변경</option><option>결과확인</option><option>매각완료</option></select><select id="sort"><option value="bid">입찰 임박순</option><option value="failed">유찰많은순</option><option value="min">최저가 낮은순</option></select><button id="reset">초기화</button></div><div class="tabs"><button class="tab on" data-mode="upcoming">입찰예정</button><button class="tab" data-mode="d7">D-7</button><button class="tab" data-mode="d30">D-30</button><button class="tab" data-mode="confirmed">편입확인</button><button class="tab" data-mode="all">전체/지난물건</button></div><div class="grid"><div class="panel"><h2 id="listTitle">오늘 이후 입찰 예정 물건</h2><div class="tablewrap"><table><thead><tr><th>지역</th><th>사건번호</th><th>소재지</th><th>상태</th><th>D-day</th><th>감정가</th><th>최저가</th><th>유찰</th><th>입찰기일</th><th>편입</th><th>관련사업</th></tr></thead><tbody id="body"></tbody></table></div></div><div class="panel"><h2>물건·사업 상세</h2><div class="detail" id="detail">왼쪽 물건을 선택하세요.</div></div></div></div><script>let AUCTION=[],PROJECTS=[],mode='upcoming';const $=s=>document.querySelector(s),money=n=>n==null?'-':new Intl.NumberFormat('ko-KR').format(n)+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),projectOf=id=>PROJECTS.find(p=>p.id===id)||{};const TODAY='2026-09-08';function days(x){if(!x.bidDate)return 9999;let a=new Date(TODAY+'T00:00:00+09:00'),b=new Date(x.bidDate+'T00:00:00+09:00');return Math.round((b-a)/86400000)}function isUpcoming(x){return days(x)>=0&&!['매각완료','취하','기각'].includes(x.status)}function dlabel(x){let d=days(x);return d===0?'D-DAY':d>0?'D-'+d:'D+'+Math.abs(d)}function filtered(){let xs=[...AUCTION],q=$('#q').value.trim().toLowerCase(),r=$('#region').value,c=$('#confirm').value,st=$('#status').value,f=Number($('#fails').value||0);xs=xs.filter(x=>{let p=projectOf(x.projectId),blob=[x.caseNo,x.address,p.name,x.note].join(' ').toLowerCase();return(!q||blob.includes(q))&&(!r||x.region===r)&&(!c||x.confirm===c)&&(!st||x.status===st)&&(!f||x.failedCount>=f)});if(mode==='upcoming')xs=xs.filter(isUpcoming);if(mode==='d7')xs=xs.filter(x=>isUpcoming(x)&&days(x)<=7);if(mode==='d30')xs=xs.filter(x=>isUpcoming(x)&&days(x)<=30);if(mode==='confirmed')xs=xs.filter(x=>isUpcoming(x)&&x.confirm!=='미확인');let s=$('#sort').value;xs.sort((a,b)=>s==='failed'?b.failedCount-a.failedCount:s==='min'?(a.minimum??1e99)-(b.minimum??1e99):days(a)-days(b));return xs}function render(){let body=$('#body');body.innerHTML='';let xs=filtered();if(!xs.length)body.innerHTML='<tr><td colspan="11" class="muted">조건에 맞는 물건이 없습니다.</td></tr>';xs.forEach(x=>{let p=projectOf(x.projectId),d=days(x),tr=document.createElement('tr'),dc=d<=2?'urgent':d<=7?'soon':'done';tr.innerHTML=`<td>${esc(x.region)}</td><td><b>${esc(x.caseNo)}${x.itemNo?' ('+esc(x.itemNo)+')':''}</b></td><td>${esc(x.address)}</td><td><span class="pill ${x.status==='진행'?'live':'done'}">${esc(x.status)}</span></td><td><span class="pill ${dc}">${esc(dlabel(x))}</span></td><td>${money(x.appraisal)}</td><td><b>${money(x.minimum)}</b></td><td>${x.failedCount}회</td><td><b>${esc(x.bidDate)}</b></td><td><span class="pill ${x.confirm==='미확인'?'wait':'ok'}">${esc(x.confirm)}</span></td><td>${esc(p.name||'-')}</td>`;tr.onclick=()=>showDetail(x);body.appendChild(tr)});let up=AUCTION.filter(isUpcoming),urgent=up.filter(x=>days(x)<=7);$('#mUpcoming').textContent=up.length;$('#mUrgent').textContent=urgent.length;$('#mConfirm').textContent=up.filter(x=>x.confirm!=='미확인').length;$('#mFail').textContent=up.filter(x=>x.failedCount>=2).length;$('#mAll').textContent=AUCTION.length;$('#listTitle').textContent=mode==='all'?'전체 후보/지난 물건':'오늘 이후 입찰 예정 물건'}function showDetail(x){let p=projectOf(x.projectId);$('#detail').innerHTML=`<h3>${esc(x.caseNo)}${x.itemNo?' ('+esc(x.itemNo)+')':''}</h3><div class="muted">${esc(x.address)}</div><div class="kv"><b>D-day</b><span>${esc(dlabel(x))}</span><b>법원</b><span>${esc(x.court)}</span><b>지목/면적</b><span>${esc(x.land)} · ${esc(x.area)}</span><b>감정가</b><span>${money(x.appraisal)}</span><b>최저가</b><span>${money(x.minimum)}</span><b>입찰기일</b><span>${esc(x.bidDate)}</span><b>상태</b><span>${esc(x.status)}</span><b>리스크</b><span>${esc(x.risk)}</span></div><div class="section"><h4>보상사업</h4><b>${esc(p.name)}</b><p>${esc(p.summary)}</p><div>시행자: ${esc(p.operator)} · 단계: ${esc(p.stage)}</div></div><div class="section"><h4>검토 메모</h4>${esc(x.note)}<br>${x.sourceUrl?`<a class="link" href="${esc(x.sourceUrl)}" target="_blank">경매자료 보기</a><br>`:''}<a class="link" href="${esc(p.officialUrl||'#')}" target="_blank">사업/보상 공고 보기</a></div>`}['q','region','confirm','fails','status','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));$('#reset').onclick=()=>{['q','region','confirm','fails','status'].forEach(id=>$('#'+id).value='');$('#sort').value='bid';render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');render()});Promise.all([fetch('auction_data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('projects.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json())]).then(([a,p])=>{AUCTION=a;PROJECTS=p;$('#stamp').textContent='2026-09-08 16:45 갱신 · '+AUCTION.length+'건';render()}).catch(e=>{$('#body').innerHTML='<tr><td colspan="11" class="error">데이터를 불러오지 못했습니다. 새로고침해주세요.</td></tr>';$('#stamp').textContent='불러오기 오류'});</script></body></html>
