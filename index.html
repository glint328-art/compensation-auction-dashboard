<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보상경매 투자 대시보드</title><style>:root{--bg:#f4f6f8;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--navy:#17365d}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1720px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:flex-end}.muted{color:var(--muted);font-size:13px}.stamp{font-size:12px;background:#e8eef8;color:var(--navy);font-weight:700;padding:7px 10px;border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.metric{padding:14px}.metric span{font-size:12px;color:var(--muted)}.metric b{display:block;font-size:25px;margin-top:4px}.filters{display:grid;grid-template-columns:2fr repeat(6,1fr) auto;gap:8px;margin:12px 0}input,select,button{height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 10px}.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tab.on{background:var(--navy);color:#fff}.grid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px}.panel{overflow:hidden}.panel h2{font-size:15px;margin:0;padding:14px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:1840px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}th{background:#f8fafc;position:sticky;top:0}.pill{padding:4px 7px;border-radius:999px;font-weight:700;font-size:10px;display:inline-block}.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.partial{background:#ede9fe;color:#6d28d9}.live{background:#dbeafe;color:#1d4ed8}.done{background:#f3f4f6;color:#4b5563}.urgent{background:#fee2e2;color:#991b1b}.soon{background:#ffedd5;color:#9a3412}.risk-low{background:#dcfce7;color:#166534}.risk-mid{background:#fef3c7;color:#92400e}.risk-high{background:#fee2e2;color:#991b1b}.detail{padding:14px}.kv{display:grid;grid-template-columns:125px 1fr;gap:7px 9px;margin:14px 0;font-size:13px}.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.section p{white-space:pre-wrap;line-height:1.55}.link{display:inline-flex;padding:10px;background:#eff6ff;color:#1d4ed8;text-decoration:none;border-radius:8px;margin:8px 6px 0 0}.notice{background:#ecfeff;border:1px solid #a5f3fc;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}.compwrap{overflow:auto;margin-top:8px}.comptable{min-width:720px;width:100%}.project-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.project-tools input{flex:1;min-width:200px}.project-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px}.project-card{padding:18px}.project-card dl{display:grid;grid-template-columns:95px 1fr;gap:8px;font-size:13px}.project-card dd{margin:0}.view-nav{display:flex;gap:8px;margin:14px 0}.view-nav .on{background:var(--navy);color:#fff}@media(max-width:1050px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(2,1fr)}table{min-width:0}.tablewrap{overflow:visible}thead{display:none}tbody tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);padding:12px 8px;gap:8px}tbody td{border:0;padding:2px 4px}tbody td:nth-child(2),tbody td:nth-child(3){grid-column:1/3}.kv{grid-template-columns:105px 1fr}.comptable{min-width:680px}}[hidden]{display:none!important}</style></head><body><div class="wrap"><div class="top"><div><h1>보상경매 투자 대시보드</h1><div class="muted">공식 보상조서 지번 대조 · 기일 확정 및 보상권리 별도 확인</div></div><div class="stamp" id="stamp">불러오는 중</div></div><nav class="view-nav"><button id="auctionViewButton" class="on">보상경매</button><button id="projectViewButton">개발사업</button><a href="map.html" class="link" style="margin:0">지도</a></nav><section id="projectView" hidden><h2>개발사업 · 보상 및 진행 현황</h2><div class="project-tools"><input id="projectQuery" placeholder="사업명·지역·시행자 검색"><select id="projectType"><option value="">사업유형 전체</option></select></div><p id="projectCount" class="muted"></p><div id="projectCards" class="project-cards"></div></section><section id="auctionView"><div class="notice"><b>보상조서 일치</b>는 공식 공고에 지번이 있는 물건입니다. 도시계획시설 저촉 후보는 실제 시행·보상 여부를 별도 검증합니다.</div><div class="metrics"><div class="metric"><span>입찰예정</span><b id="mUpcoming">-</b></div><div class="metric"><span>D-7 이내</span><b id="mUrgent">-</b></div><div class="metric"><span>기일 확정·보상조서 일치</span><b id="mConfirm">-</b></div><div class="metric"><span>2회 이상 유찰</span><b id="mFail">-</b></div><div class="metric"><span>전체 DB</span><b id="mAll">-</b></div></div><div class="filters"><input id="q" placeholder="사건번호·지번·사업명 검색"><select id="region"><option value="">전국</option><option>수도권</option><option>충청권</option><option>호남권</option><option>영남권</option><option>강원권</option><option>제주권</option></select><select id="confirm"><option value="">편입확인 전체</option><option>확인</option><option>부분확인</option><option>미확인</option><option>제외</option></select><select id="inclusion"><option value="">편입구분 전체</option><option>전부편입</option><option>일부편입</option><option>편입범위확인중</option></select><select id="fails"><option value="">유찰횟수 전체</option><option value="1">1회 이상</option><option value="2">2회 이상</option><option value="3">3회 이상</option><option value="4">4회 이상</option></select><select id="status"><option value="">상태 전체</option><option>진행</option><option>기일대기</option><option>변경</option><option>결과확인</option><option>매각완료</option></select><select id="sort"><option value="bid">입찰 임박순</option><option value="failed">유찰많은순</option><option value="min">최저가 낮은순</option></select><button id="reset">초기화</button></div><div class="tabs"><button class="tab" data-mode="verified">보상조서 일치</button><button class="tab" data-mode="waiting">기일 대기</button><button class="tab" data-mode="upcoming">입찰예정 후보</button><button class="tab on" data-mode="d7">D-7</button><button class="tab" data-mode="d30">D-30</button><button class="tab" data-mode="confirmed">편입확인</button><button class="tab" data-mode="all">전체/지난물건</button></div><div class="grid"><div class="panel"><h2 id="listTitle">7일 이내 입찰 후보</h2><div class="tablewrap"><table><thead><tr><th>지역</th><th>사건번호</th><th>소재지</th><th>상태</th><th>D-day</th><th>감정가</th><th>최저가</th><th>유찰</th><th>입찰기일</th><th>편입확인</th><th>편입구분</th><th>주변시세</th><th>추천 입찰가</th><th>예상 낙찰가율</th><th>권리위험</th><th>관련사업</th></tr></thead><tbody id="body"></tbody></table></div></div><div class="panel" id="detailPanel"><h2>물건·사업 상세</h2><div class="detail" id="detail">물건을 선택하세요.</div></div></div></section></div><script>let AUCTION=[],PROJECTS=[],mode='d7';const $=s=>document.querySelector(s),money=n=>n==null?'-':new Intl.NumberFormat('ko-KR').format(n)+'원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),projectOf=id=>PROJECTS.find(p=>p.id===id)||{};const TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function days(x){if(!x.bidDate)return Infinity;return Math.round((new Date(x.bidDate+'T00:00:00+09:00')-new Date(TODAY+'T00:00:00+09:00'))/86400000)}function upcoming(x){return Number.isFinite(days(x))&&days(x)>=0&&x.status==='진행'}function dlabel(x){let d=days(x);return !Number.isFinite(d)?'기일 미정':d===0?'D-DAY':d>0?'D-'+d:'D+'+Math.abs(d)}function inc(x){return x.inclusionType||'편입범위확인중'}function filtered(){let xs=[...AUCTION],q=$('#q').value.trim().toLowerCase(),r=$('#region').value,c=$('#confirm').value,i=$('#inclusion').value,st=$('#status').value,f=Number($('#fails').value||0);xs=xs.filter(x=>{let p=projectOf(x.projectId),blob=[x.caseNo,x.address,p.name,x.note].join(' ').toLowerCase();return(!q||blob.includes(q))&&(!r||x.region===r)&&(!c||x.confirm===c)&&(!i||inc(x)===i)&&(!st||x.status===st)&&(!f||x.failedCount>=f)});if(mode==='verified')xs=xs.filter(x=>x.expropriationVerified===true&&!['매각완료','취하','기각'].includes(x.status));if(mode==='waiting')xs=xs.filter(x=>!x.bidDate&&!['매각완료','취하','기각'].includes(x.status));if(mode==='upcoming')xs=xs.filter(upcoming);if(mode==='d7')xs=xs.filter(x=>upcoming(x)&&days(x)<=7);if(mode==='d30')xs=xs.filter(x=>upcoming(x)&&days(x)<=30);if(mode==='confirmed')xs=xs.filter(x=>upcoming(x)&&['확인','부분확인'].includes(x.confirm));let s=$('#sort').value;xs.sort((a,b)=>s==='failed'?b.failedCount-a.failedCount:s==='min'?(a.minimum??1e99)-(b.minimum??1e99):days(a)-days(b));return xs}function render(){let xs=filtered(),body=$('#body');body.innerHTML='';$('#listTitle').textContent=mode==='d7'?'7일 이내 입찰 후보':mode==='d30'?'30일 이내 입찰 후보':'보상경매 후보';xs.forEach(x=>{let p=projectOf(x.projectId),tr=document.createElement('tr'),dc=days(x)<=2?'urgent':days(x)<=7?'soon':'done',ic=inc(x)==='전부편입'?'ok':inc(x)==='일부편입'?'partial':'wait';tr.innerHTML=`<td>${esc(x.region)}</td><td><b>${esc(x.caseNo)}${x.itemNo?' ('+esc(x.itemNo)+')':''}</b></td><td>${esc(x.address)}</td><td><span class="pill ${x.status==='진행'?'live':'done'}">${esc(x.status)}</span></td><td><span class="pill ${dc}">${dlabel(x)}</span></td><td>${money(x.appraisal)}</td><td><b>${money(x.minimum)}</b></td><td>${x.failedCount}회</td><td>${esc(x.bidDate||'-')}</td><td>${esc(x.confirm)}</td><td><span class="pill ${ic}">${esc(inc(x))}</span></td><td>${esc(x.marketPriceEstimate||x.comparableSalesRangePerSqm||'분석대기')}</td><td>${x.recommendedBidTarget?money(x.recommendedBidTarget):'분석대기'}</td><td>${esc(x.expectedWinningRate||'분석대기')}</td><td>${esc(x.rightsRiskLevel||'확인필요')}</td><td>${esc(p.name||'-')}</td>`;tr.onclick=()=>showDetail(x);body.appendChild(tr)});if(!xs.length)body.innerHTML='<tr><td colspan="16">조건에 맞는 물건이 없습니다.</td></tr>';let up=AUCTION.filter(upcoming);$('#mUpcoming').textContent=up.length;$('#mUrgent').textContent=up.filter(x=>days(x)<=7).length;$('#mConfirm').textContent=up.filter(x=>x.expropriationVerified===true).length;$('#mFail').textContent=up.filter(x=>x.failedCount>=2).length;$('#mAll').textContent=AUCTION.length}function comps(x){let a=Array.isArray(x.comparableSales)?x.comparableSales:[];if(!a.length)return `<p class="muted">${esc(x.comparableSalesRangePerSqm||'실거래 분석대기')}</p>`;return '<div class="compwrap"><table class="comptable"><tr><th>거래일</th><th>지역</th><th>면적</th><th>거래금액</th><th>㎡당</th><th>평당</th><th>비교메모</th></tr>'+a.map(s=>`<tr><td>${esc(s.date||'-')}</td><td>${esc(s.location||'-')}</td><td>${esc(s.area||s.areaSqm||'-')}</td><td>${money(s.price)}</td><td>${money(s.pricePerSqm||s.perSqm)}</td><td>${money(s.pricePerPyeong||s.perPyeong)}</td><td>${esc(s.comparisonNote||s.memo||'')}</td></tr>`).join('')+'</table></div>'}function showDetail(x){let p=projectOf(x.projectId);$('#detail').innerHTML=`<h3>${esc(x.caseNo)} (${esc(x.itemNo||'1')})</h3><div>${esc(x.address)}</div><div class="kv"><b>입찰기일</b><span>${esc(x.bidDate||'-')} · ${dlabel(x)}</span><b>감정가</b><span>${money(x.appraisal)}</span><b>최저가</b><span>${money(x.minimum)}</span><b>유찰</b><span>${x.failedCount}회</span><b>편입확인</b><span>${esc(x.confirm)}</span><b>편입구분</b><span>${esc(inc(x))}</span><b>편입면적</b><span>${esc(x.partialArea||'확인중')}</span><b>잔여면적</b><span>${esc(x.residualArea||'확인중')}</span><b>권리위험</b><span>${esc(x.rightsRiskLevel||'확인필요')}</span></div><div class="section"><h4>검토 메모</h4><p>${esc(x.note||'')}</p><p>${esc(x.risk||'')}</p>${x.sourceUrl&&/madangs\.com/.test(x.sourceUrl)?`<a class="link" href="${esc(x.sourceUrl)}" target="_blank">경매마당 상세보기</a>`:''}</div><div class="section"><h4>주변 실거래 사례</h4>${comps(x)}</div><div class="section"><h4>권리분석</h4><p>${esc(x.rightsAnalysis||'최신 등기·명세서 확인필요')}</p></div><div class="section"><h4>관련 사업</h4><b>${esc(p.name||'사업정보 확인중')}</b><p>${esc(p.summary||'')}</p></div>`}function renderProjects(){let q=$('#projectQuery').value.trim().toLowerCase(),t=$('#projectType').value,ps=PROJECTS.filter(p=>(!q||[p.name,p.location,p.operator,p.summary].join(' ').toLowerCase().includes(q))&&(!t||p.type===t));$('#projectCount').textContent=ps.length+'건 표시 / 등록 '+PROJECTS.length+'건';$('#projectCards').innerHTML=ps.map(p=>`<article class="panel project-card"><h3>${esc(p.name)}</h3><p>${esc(p.summary||'')}</p><dl><dt>유형</dt><dd>${esc(p.type||'-')}</dd><dt>시행자</dt><dd>${esc(p.operator||'-')}</dd><dt>단계</dt><dd>${esc(p.stage||'-')}</dd><dt>확인일</dt><dd>${esc(p.checkedAt||'-')}</dd></dl>${p.officialUrl?`<a class="link" href="${esc(p.officialUrl)}" target="_blank">공식 자료 보기</a>`:''}</article>`).join('')}['q','region','confirm','inclusion','fails','status','sort'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));$('#reset').onclick=()=>location.reload();document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.mode;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));t.classList.add('on');render()});$('#projectQuery').oninput=renderProjects;$('#projectType').onchange=renderProjects;$('#projectViewButton').onclick=()=>{$('#projectView').hidden=false;$('#auctionView').hidden=true;renderProjects()};$('#auctionViewButton').onclick=()=>{$('#projectView').hidden=true;$('#auctionView').hidden=false};async function j(url){let r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});return r.ok?r.json():[]}Promise.all([j('auction_data.json'),j('auction_data_supplement.json'),j('auction_data_new_20260914.json'),j('projects.json'),j('projects_supplement.json')]).then(([a,as,an,p,ps])=>{let ids=new Set(a.map(x=>x.id));let merged=[...a,...as.filter(x=>!ids.has(x.id))];let mids=new Set(merged.map(x=>x.id));AUCTION=[...merged,...an.filter(x=>!mids.has(x.id))];let pids=new Set(p.map(x=>x.id));PROJECTS=[...p,...ps.filter(x=>!pids.has(x.id))];$('#projectType').innerHTML='<option value="">사업유형 전체</option>'+[...new Set(PROJECTS.map(x=>x.type).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('');$('#stamp').textContent='대조 '+TODAY+' · '+AUCTION.length+'건';render();let xs=filtered();if(xs.length)showDetail(xs[0]);renderProjects()}).catch(()=>$('#stamp').textContent='불러오기 오류');</script></body></html>
